<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Modern Man's Edge — Sales Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Geist+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0b0a08;
  --surface: #15130f;
  --surface2: #1f1c16;
  --gold: #c9a14a;
  --gold2: #e8c66e;
  --gold-dim: #6b5530;
  --green: #6ec585;
  --red: #e07a6b;
  --blue: #7ab0e0;
  --text: #f0ead8;
  --muted: #8a8270;
  --muted2: #5a5447;
  --border: #2d2920;
  --border2: #3d3829;
}

html, body {
  font-family: 'Geist', sans-serif;
  color: var(--text);
  background: var(--bg);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
  background-image:
    radial-gradient(at 20% 0%, rgba(201, 161, 74, 0.08) 0px, transparent 50%),
    radial-gradient(at 80% 100%, rgba(122, 176, 224, 0.04) 0px, transparent 50%);
}

body { padding: 24px; max-width: 1400px; margin: 0 auto; }

.header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid var(--border);
  flex-wrap: wrap; gap: 14px;
}

.brand { display: flex; align-items: center; gap: 14px; }

.mark {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  display: flex; align-items: center; justify-content: center;
  font-family: 'Fraunces', serif; font-weight: 900; color: #0b0a08;
  font-size: 20px; font-style: italic; border-radius: 4px;
  box-shadow: 0 6px 20px rgba(201, 161, 74, 0.25);
}

.title {
  font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600;
  color: var(--gold2); letter-spacing: -0.01em; font-style: italic;
}

.subtitle {
  font-size: 11px; color: var(--muted); text-transform: uppercase;
  letter-spacing: 0.18em; margin-top: 2px;
}

.status-strip { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.status-pill {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 100px;
  font-size: 11px; color: var(--muted);
}

.dot { width: 6px; height: 6px; border-radius: 50%; }
.dot.csv { background: var(--blue); box-shadow: 0 0 8px var(--blue); }
.dot.gold { background: var(--gold2); box-shadow: 0 0 8px var(--gold2); }

.period-strip {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px; gap: 14px; flex-wrap: wrap;
}

.tabs {
  display: flex; gap: 2px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 10px; padding: 3px;
  flex-wrap: wrap;
}

.tab {
  padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 500;
  color: var(--muted); cursor: pointer; border: none; background: transparent;
  font-family: inherit; letter-spacing: 0.02em; transition: all 0.15s;
}
.tab:hover:not(.active) { color: var(--text); }
.tab.active {
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  color: #0b0a08; font-weight: 600;
}

.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.btn {
  padding: 9px 14px; border-radius: 8px; font-family: inherit;
  font-size: 12px; font-weight: 500; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text); transition: all 0.15s;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { border-color: var(--gold-dim); color: var(--gold2); }
.btn.primary {
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  color: #0b0a08; border: none; font-weight: 600;
}
.btn.primary:hover { opacity: 0.9; color: #0b0a08; }
.btn.blue {
  background: linear-gradient(135deg, #4d80b3, #7ab0e0);
  color: #0b0a08; border: none; font-weight: 600;
}
.btn.blue:hover { opacity: 0.9; color: #0b0a08; }

.metrics, .metrics2 {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 12px; margin-bottom: 12px;
}
@media (max-width: 900px) {
  .metrics, .metrics2 { grid-template-columns: repeat(2, 1fr); }
}

.stat {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 16px; position: relative; overflow: hidden;
}
.stat.hero {
  background: linear-gradient(135deg, var(--surface) 0%, rgba(201, 161, 74, 0.08) 100%);
  border-color: var(--gold-dim);
}

.stat-label {
  font-size: 10px; color: var(--muted); text-transform: uppercase;
  letter-spacing: 0.18em; margin-bottom: 10px; font-weight: 500;
}

.stat-value {
  font-family: 'Fraunces', serif; font-size: 26px; font-weight: 600;
  letter-spacing: -0.02em; color: var(--text);
  display: flex; align-items: baseline; gap: 4px; line-height: 1;
}
.stat-value.gold { color: var(--gold2); font-style: italic; }
.stat-value.green { color: var(--green); }
.stat-value.red { color: var(--red); }
.stat-value.blue { color: var(--blue); }

.stat-currency {
  font-family: 'Geist Mono', monospace; font-size: 13px;
  font-weight: 400; color: var(--muted); font-style: normal;
}

.stat-sub { font-size: 11px; color: var(--muted); margin-top: 8px; }

.charts-row {
  display: grid; grid-template-columns: 1.6fr 1fr;
  gap: 12px; margin-bottom: 24px;
}
@media (max-width: 900px) { .charts-row { grid-template-columns: 1fr; } }

.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 20px;
}

.panel-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 18px; flex-wrap: wrap; gap: 8px;
}

.panel-title {
  font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600;
  color: var(--text); letter-spacing: -0.01em;
}

.panel-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

.legend { display: flex; gap: 14px; font-size: 11px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.legend-dot { width: 8px; height: 8px; border-radius: 2px; }

.chart {
  height: 220px; display: flex; align-items: flex-end;
  gap: 4px; padding-top: 10px; position: relative;
}
.chart::before {
  content: ''; position: absolute; bottom: 22px; left: 0; right: 0;
  height: 1px; background: var(--border);
}

.bar-group {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 4px; height: 100%; justify-content: flex-end; position: relative; cursor: pointer;
}

.bar-stack {
  width: 80%; display: flex; flex-direction: row; gap: 2px;
  align-items: flex-end; height: calc(100% - 22px); position: relative;
}

.bar { width: 100%; border-radius: 2px 2px 0 0; transition: opacity 0.2s; }
.bar.revenue { background: linear-gradient(180deg, var(--gold2), var(--gold)); }
.bar.profit { background: linear-gradient(180deg, var(--green), #4ea568); }
.bar.spend { background: linear-gradient(180deg, var(--blue), #4d80b3); opacity: 0.85; }
.bar-group:hover .bar { opacity: 0.85; }

.bar-label {
  font-size: 10px; color: var(--muted); font-family: 'Geist Mono', monospace;
  height: 18px; display: flex; align-items: center; white-space: nowrap;
}

.bar-tooltip {
  position: absolute; bottom: 100%; left: 50%;
  transform: translateX(-50%) translateY(-8px);
  background: #000; border: 1px solid var(--gold-dim);
  border-radius: 8px; padding: 8px 12px; font-size: 11px;
  white-space: nowrap; pointer-events: none; opacity: 0;
  transition: opacity 0.15s; z-index: 10; font-family: 'Geist Mono', monospace;
}
.bar-group:hover .bar-tooltip { opacity: 1; }
.tooltip-row { display: flex; justify-content: space-between; gap: 12px; }
.tooltip-label { color: var(--muted); }

.donut-wrap {
  display: flex; flex-direction: column; align-items: center;
  height: 220px; justify-content: space-around;
}
.donut { position: relative; width: 130px; height: 130px; }
.donut svg { transform: rotate(-90deg); }

.donut-center {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.donut-center-val {
  font-family: 'Fraunces', serif; font-size: 22px; color: var(--gold2);
  font-style: italic; font-weight: 600; line-height: 1;
}
.donut-center-label {
  font-size: 9px; color: var(--muted); text-transform: uppercase;
  letter-spacing: 0.15em; margin-top: 4px;
}
.donut-legend { display: flex; flex-direction: column; gap: 6px; width: 100%; font-size: 11px; }
.donut-legend-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.donut-legend-left { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.donut-legend-val { font-family: 'Geist Mono', monospace; color: var(--text); font-size: 11px; }

.table-section {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; overflow: hidden; margin-bottom: 14px;
}

.table-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; border-bottom: 1px solid var(--border);
  flex-wrap: wrap; gap: 12px;
}

.section-tabs {
  display: flex; gap: 2px; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 8px; padding: 2px;
}
.section-tab {
  padding: 6px 12px; border-radius: 6px; font-size: 11px;
  cursor: pointer; border: none; background: transparent;
  color: var(--muted); font-family: inherit; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.08em;
}
.section-tab.active { background: var(--gold-dim); color: var(--gold2); }

.table-wrap { max-height: 380px; overflow-y: auto; }
.tbl { width: 100%; border-collapse: collapse; }

.tbl th {
  position: sticky; top: 0; background: var(--surface2);
  text-align: left; padding: 10px 20px; font-size: 10px;
  text-transform: uppercase; letter-spacing: 0.15em;
  color: var(--muted); font-weight: 500;
  border-bottom: 1px solid var(--border); z-index: 5;
}

.tbl td {
  padding: 11px 20px; font-size: 13px;
  border-bottom: 1px solid rgba(45, 41, 32, 0.5);
  font-family: 'Geist Mono', monospace;
}
.tbl tr:last-child td { border-bottom: none; }
.tbl tr:hover td { background: var(--surface2); }

.source-tag {
  display: inline-block; padding: 2px 8px; border-radius: 100px;
  font-size: 10px; font-family: 'Geist', sans-serif; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.08em;
}
.source-tag.meta { background: rgba(122, 176, 224, 0.15); color: var(--blue); }
.source-tag.organic { background: rgba(110, 197, 133, 0.15); color: var(--green); }
.source-tag.other { background: rgba(180, 160, 120, 0.15); color: #d4b88a; }

.icon-btn {
  background: transparent; border: none; color: var(--muted);
  cursor: pointer; padding: 4px; border-radius: 4px;
  transition: all 0.15s; font-size: 14px;
}
.icon-btn:hover { color: var(--red); background: rgba(224, 122, 107, 0.1); }

.empty { padding: 56px 22px; text-align: center; color: var(--muted); }
.empty-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.4; }
.empty-title {
  font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600;
  color: var(--text); margin-bottom: 6px; font-style: italic;
}

.modal-bg {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(6px);
  display: none; align-items: center; justify-content: center;
  z-index: 100; padding: 20px;
}
.modal-bg.show { display: flex; }

.modal {
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: 16px; padding: 28px;
  width: 540px; max-width: 100%; max-height: 90vh; overflow-y: auto;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
}

.modal-title {
  font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600;
  color: var(--gold2); font-style: italic; margin-bottom: 6px;
}

.modal-sub { font-size: 12px; color: var(--muted); margin-bottom: 18px; }

.form-group { margin-bottom: 14px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.lbl {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em;
  color: var(--muted); margin-bottom: 6px; display: block; font-weight: 500;
}

.inp, .sel, .ta {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); padding: 10px 12px; border-radius: 8px;
  font-family: inherit; font-size: 13px; outline: none;
  transition: border-color 0.15s;
}
.inp:focus, .sel:focus, .ta:focus { border-color: var(--gold-dim); }
.ta {
  font-family: 'Geist Mono', monospace; font-size: 12px;
  resize: vertical; min-height: 110px;
}

.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.modal-actions .btn { flex: 1; justify-content: center; }
.modal-actions .btn.primary, .modal-actions .btn.blue { flex: 1.5; }

.info-strip {
  background: rgba(122, 176, 224, 0.06);
  border: 1px solid rgba(122, 176, 224, 0.2);
  border-radius: 10px; padding: 12px 14px;
  font-size: 12px; color: var(--muted);
  margin-bottom: 14px; line-height: 1.55;
}
.info-strip b { color: var(--blue); }
.info-strip code {
  background: rgba(122, 176, 224, 0.1); padding: 1px 5px;
  border-radius: 3px; font-family: 'Geist Mono', monospace; font-size: 11px;
}

.warn-strip {
  background: rgba(201, 161, 74, 0.06);
  border: 1px solid rgba(201, 161, 74, 0.25);
  border-radius: 10px; padding: 12px 14px;
  font-size: 12px; color: var(--muted);
  margin-bottom: 16px; line-height: 1.55;
}
.warn-strip b { color: var(--gold2); }

.modal-tabs {
  display: flex; gap: 2px; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 2px; margin-bottom: 18px; flex-wrap: wrap;
}
.modal-tab {
  flex: 1; padding: 8px 12px; border-radius: 6px; min-width: 80px;
  border: none; background: transparent; cursor: pointer;
  color: var(--muted); font-family: inherit; font-size: 12px; font-weight: 500;
}
.modal-tab.active { background: var(--gold-dim); color: var(--gold2); }

.footer {
  text-align: center; font-size: 10px; color: var(--muted2);
  margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border);
  letter-spacing: 0.12em; text-transform: uppercase;
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--gold-dim); }

.loading { text-align: center; padding: 40px; color: var(--muted); }

/* Onboarding */
.onboard-card {
  background: linear-gradient(135deg, var(--surface) 0%, rgba(201,161,74,0.06) 100%);
  border: 1px solid var(--gold-dim); border-radius: 16px;
  padding: 22px 24px; margin-bottom: 24px;
}
.onboard-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px; gap: 12px; flex-wrap: wrap;
}
.onboard-title {
  font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600;
  color: var(--gold2); font-style: italic;
}
.onboard-dismiss {
  font-size: 11px; color: var(--muted); background: none; border: none;
  cursor: pointer; font-family: inherit; text-decoration: underline;
  text-underline-offset: 2px;
}
.onboard-dismiss:hover { color: var(--text); }
.onboard-steps {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
}
@media (max-width: 900px) { .onboard-steps { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 500px) { .onboard-steps { grid-template-columns: 1fr; } }
.onboard-step {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px; display: flex; gap: 12px;
}
.onboard-num {
  width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  color: #0b0a08; font-weight: 700; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
}
.onboard-body { flex: 1; }
.onboard-label {
  font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 4px;
}
.onboard-desc { font-size: 11px; color: var(--muted); line-height: 1.5; }
.onboard-desc b { color: var(--gold2); font-weight: 600; }

/* Numbered how-to steps inside modals */
.how-steps { display: flex; flex-direction: column; gap: 10px; margin: 4px 0; }
.how-step { display: flex; gap: 10px; align-items: flex-start; }
.how-step-num {
  width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
  background: var(--gold-dim); color: var(--gold2);
  font-size: 10px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; margin-top: 1px;
}
.how-step-body { flex: 1; font-size: 12px; color: var(--muted); line-height: 1.5; }
.how-step-body b { color: var(--text); font-weight: 600; }
.how-step-body code {
  background: rgba(201,161,74,0.12); color: var(--gold2);
  padding: 1px 5px; border-radius: 3px;
  font-family: 'Geist Mono', monospace; font-size: 11px;
}

/* Code block */
.code-block {
  background: #060504; border: 1px solid var(--border2); border-radius: 8px;
  padding: 10px 14px; font-family: 'Geist Mono', monospace; font-size: 11px;
  color: var(--gold2); white-space: pre-wrap; word-break: break-all;
  margin: 8px 0; position: relative;
}
.code-copy-btn {
  position: absolute; top: 6px; right: 8px;
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--muted); font-size: 10px; padding: 3px 7px; border-radius: 4px;
  cursor: pointer; font-family: inherit;
}
.code-copy-btn:hover { color: var(--gold2); border-color: var(--gold-dim); }

/* Sub-tabs (inside modal tabs) */
.sub-tabs {
  display: flex; gap: 2px; background: rgba(0,0,0,0.3);
  border: 1px solid var(--border); border-radius: 7px;
  padding: 2px; margin-bottom: 14px;
}
.sub-tab {
  flex: 1; padding: 7px 10px; border-radius: 5px; border: none;
  background: transparent; cursor: pointer; color: var(--muted);
  font-family: inherit; font-size: 11px; font-weight: 500;
  text-align: center; transition: all 0.15s; white-space: nowrap;
}
.sub-tab.active { background: var(--surface2); color: var(--text); border: 1px solid var(--border2); }
.sub-tab:hover:not(.active) { color: var(--text); }

@media print {
  body { background: white !important; color: black !important; }
  .actions, .icon-btn, .modal-bg, .footer { display: none !important; }
  .panel, .stat, .table-section { background: white !important; border-color: #ccc !important; box-shadow: none !important; }
  .stat-value, .panel-title, .title { color: #333 !important; }
  .stat-value.gold { color: #c9a14a !important; }
  .stat-value.green { color: #2d8a4a !important; }
  .stat-value.blue { color: #2a6090 !important; }
}
</style>
</head>
<body>

<div id="app"><div class="loading">Loading dashboard…</div></div>

<script>
(function() {
  const app = document.getElementById('app');
  const STATE = {
    sales: [], spend: [],
    settings: { price: 999, feePercent: 5, brand: "The Modern Man's Edge" },
    period: '30d', section: 'sales'
  };

  const KEY = 'tmeDashboard_v1';

  // ---------- Storage ----------
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed.sales) STATE.sales = parsed.sales;
        if (parsed.spend) STATE.spend = parsed.spend;
        if (parsed.settings) STATE.settings = { ...STATE.settings, ...parsed.settings };
      }
    } catch(e) { console.warn('Load failed', e); }
  }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        sales: STATE.sales, spend: STATE.spend, settings: STATE.settings
      }));
    } catch(e) { console.warn('Save failed', e); }
  }

  // ---------- Helpers ----------
  const fmt = (n) => '₹' + Math.round(n).toLocaleString('en-IN');
  const fmtShort = (n) => {
    const abs = Math.abs(n);
    if (abs >= 100000) return '₹' + (n/100000).toFixed(1) + 'L';
    if (abs >= 1000) return '₹' + (n/1000).toFixed(1) + 'K';
    return '₹' + Math.round(n);
  };
  const fmtDate = (d) => new Date(d).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: '2-digit' });
  const todayISO = () => new Date().toISOString().slice(0,10);
  const uid = (p) => p + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
  const escapeHtml = (s) => String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // ---------- Aggregation ----------
  function periodRange(p) {
    const end = new Date(); end.setHours(23,59,59,999);
    const start = new Date(); start.setHours(0,0,0,0);
    if (p === '7d') start.setDate(start.getDate() - 6);
    else if (p === '30d') start.setDate(start.getDate() - 29);
    else if (p === 'mtd') start.setDate(1);
    else if (p === 'ytd') { start.setMonth(0); start.setDate(1); }
    else if (p === 'all') start.setFullYear(2000);
    return { start, end };
  }
  function inPeriod(dateStr, p) {
    const { start, end } = periodRange(p);
    const d = new Date(dateStr);
    return d >= start && d <= end;
  }

  function aggregate(p) {
    const sales = STATE.sales.filter(s => inPeriod(s.date, p));
    const spend = STATE.spend.filter(s => inPeriod(s.date, p));
    const totalQty = sales.reduce((a,s) => a + (s.qty||0), 0);
    const revenue = sales.reduce((a,s) => a + (s.qty||0) * (s.price||STATE.settings.price), 0);
    const adSpend = spend.reduce((a,s) => a + (s.amount||0), 0);
    const fees = revenue * (STATE.settings.feePercent / 100);
    const profit = revenue - adSpend - fees;
    const roas = adSpend > 0 ? revenue / adSpend : 0;
    const avgOrder = totalQty > 0 ? revenue / totalQty : 0;
    const cps = totalQty > 0 ? adSpend / totalQty : 0;
    const margin = revenue > 0 ? profit / revenue : 0;
    return { totalQty, revenue, adSpend, fees, profit, roas, avgOrder, cps, margin };
  }

  function bySource(p) {
    const sales = STATE.sales.filter(s => inPeriod(s.date, p));
    const out = { meta: 0, organic: 0, other: 0 };
    sales.forEach(s => {
      const rev = (s.qty||0) * (s.price||STATE.settings.price);
      out[s.source || 'other'] = (out[s.source || 'other'] || 0) + rev;
    });
    return out;
  }

  function dailyBuckets(p) {
    const { start, end } = periodRange(p);
    const days = Math.ceil((end - start) / 86400000) + 1;
    let bucketSize = 'day', numBuckets = days;
    if (p === 'ytd' || days > 60) { bucketSize = 'month'; numBuckets = 12; }
    else if (days > 14) { bucketSize = 'week'; numBuckets = Math.ceil(days/7); }

    const buckets = [];
    if (bucketSize === 'day') {
      for (let i = 0; i < numBuckets; i++) {
        const d = new Date(start); d.setDate(d.getDate() + i);
        buckets.push({
          key: d.toISOString().slice(0,10),
          label: d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }),
          revenue: 0, spend: 0, profit: 0, qty: 0
        });
      }
    } else if (bucketSize === 'week') {
      for (let i = 0; i < numBuckets; i++) {
        const d = new Date(start); d.setDate(d.getDate() + i*7);
        buckets.push({
          key: 'w' + i,
          label: d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }),
          revenue: 0, spend: 0, profit: 0, qty: 0
        });
      }
    } else {
      for (let m = 0; m < 12; m++) {
        const d = new Date(); d.setMonth(m); d.setDate(1);
        buckets.push({
          key: 'm'+m, month: m,
          label: d.toLocaleDateString('en-IN', { month: 'short' }),
          revenue: 0, spend: 0, profit: 0, qty: 0
        });
      }
    }

    const placeInBucket = (dateStr) => {
      const sd = new Date(dateStr);
      if (bucketSize === 'day') return buckets.find(b => b.key === sd.toISOString().slice(0,10));
      if (bucketSize === 'week') {
        const idx = Math.floor((sd - start) / (7 * 86400000));
        return buckets[idx];
      }
      return buckets[sd.getMonth()];
    };

    STATE.sales.filter(s => inPeriod(s.date, p)).forEach(s => {
      const b = placeInBucket(s.date);
      if (b) {
        const rev = (s.qty||0) * (s.price || STATE.settings.price);
        b.revenue += rev; b.qty += s.qty||0;
      }
    });
    STATE.spend.filter(s => inPeriod(s.date, p)).forEach(s => {
      const b = placeInBucket(s.date);
      if (b) b.spend += s.amount||0;
    });
    buckets.forEach(b => { b.profit = b.revenue - b.spend - (b.revenue * STATE.settings.feePercent / 100); });
    return buckets;
  }

  // ---------- CSV parsing ----------
  function parseCsvLine(line) {
    const result = [];
    let cur = '', inQ = false;
    for (const c of line) {
      if (c === '"') inQ = !inQ;
      else if (c === ',' && !inQ) { result.push(cur); cur = ''; }
      else cur += c;
    }
    result.push(cur);
    return result.map(s => s.replace(/^"|"$/g, '').trim());
  }
  function parseDateFlex(s) {
    if (!s) return null;
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
    const d = new Date(s);
    if (!isNaN(d.getTime())) return d.toISOString().slice(0,10);
    return null;
  }
  function parseMetaCsv(text) {
    const lines = text.split('\n').map(l => l.replace(/\r$/, '')).filter(l => l.trim());
    if (lines.length < 2) return { error: 'Need at least a header row and one data row.' };
    const headers = parseCsvLine(lines[0]).map(h => h.toLowerCase().trim());
    const dateIdx = headers.findIndex(h => /^day$|^date$|reporting.?start/i.test(h));
    const spendIdx = headers.findIndex(h => /amount.?spent|^spend$|^spent$/i.test(h));
    const campaignIdx = headers.findIndex(h => /campaign.?name|^campaign$/i.test(h));
    if (dateIdx === -1 || spendIdx === -1) {
      return { error: 'Could not find Date and Amount Spent columns. Found headers: ' + headers.slice(0,8).join(', ') };
    }
    const byDate = {};
    let skipped = 0;
    lines.slice(1).forEach(line => {
      const cells = parseCsvLine(line);
      if (cells.length <= Math.max(dateIdx, spendIdx)) { skipped++; return; }
      const dateRaw = cells[dateIdx];
      const spendRaw = (cells[spendIdx] || '').replace(/[^\d.-]/g, '');
      const spend = parseFloat(spendRaw);
      const date = parseDateFlex(dateRaw);
      if (!date || isNaN(spend) || spend < 0) { skipped++; return; }
      if (!byDate[date]) byDate[date] = { date, amount: 0, campaign: campaignIdx >= 0 ? (cells[campaignIdx] || '') : '' };
      byDate[date].amount += spend;
    });
    return { rows: Object.values(byDate), skipped };
  }
  function parseSalesCsv(text) {
    const lines = text.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'));
    const out = []; let skipped = 0;
    lines.forEach(line => {
      const parts = parseCsvLine(line);
      if (parts.length < 2) { skipped++; return; }
      const date = parseDateFlex(parts[0]);
      if (!date) { skipped++; return; }
      const qty = parseInt(parts[1]) || 1;
      const price = parseFloat(parts[2]) || STATE.settings.price;
      const source = ['meta','organic','other'].includes((parts[3]||'').toLowerCase()) ? parts[3].toLowerCase() : 'other';
      const note = parts.slice(4).join(', ') || '';
      out.push({ id: uid('s'), date, qty, price, source, note });
    });
    return { rows: out, skipped };
  }

  // ---------- CSV / Excel export ----------
  function csvEscape(val) {
    if (val == null) return '';
    const s = String(val);
    if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function downloadCSV(rows, filename) {
    // BOM ensures Excel detects UTF-8 (rupee sign, accents)
    const csv = '\uFEFF' + rows.map(r => r.map(csvEscape).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  }

  function exportSalesCsv() {
    const headers = ['Date', 'Source', 'Quantity', 'Price (INR)', 'Revenue (INR)', 'Note'];
    const rows = STATE.sales
      .slice()
      .sort((a,b) => new Date(a.date) - new Date(b.date))
      .map(s => {
        const price = s.price || STATE.settings.price;
        return [s.date, s.source || 'other', s.qty || 0, price, (s.qty || 0) * price, s.note || ''];
      });
    downloadCSV([headers, ...rows], `sales-${todayISO()}.csv`);
  }

  function exportSpendCsv() {
    const headers = ['Date', 'Platform', 'Amount (INR)', 'Campaign'];
    const rows = STATE.spend
      .slice()
      .sort((a,b) => new Date(a.date) - new Date(b.date))
      .map(s => [s.date, s.platform || 'meta', s.amount || 0, s.campaign || '']);
    downloadCSV([headers, ...rows], `ad-spend-${todayISO()}.csv`);
  }

  function dailySummaryRows() {
    const byDate = {};
    STATE.sales.forEach(s => {
      const rev = (s.qty||0) * (s.price || STATE.settings.price);
      if (!byDate[s.date]) byDate[s.date] = { date: s.date, revenue: 0, spend: 0, qty: 0 };
      byDate[s.date].revenue += rev;
      byDate[s.date].qty += s.qty || 0;
    });
    STATE.spend.forEach(s => {
      if (!byDate[s.date]) byDate[s.date] = { date: s.date, revenue: 0, spend: 0, qty: 0 };
      byDate[s.date].spend += s.amount || 0;
    });
    const fee = STATE.settings.feePercent / 100;
    return Object.values(byDate)
      .sort((a,b) => new Date(a.date) - new Date(b.date))
      .map(d => {
        const fees = d.revenue * fee;
        const profit = d.revenue - d.spend - fees;
        const roas = d.spend > 0 ? d.revenue / d.spend : 0;
        return [d.date, d.qty, d.revenue, d.spend, fees, profit, roas.toFixed(2)];
      });
  }

  function exportSummaryCsv() {
    const headers = ['Date', 'Copies Sold', 'Revenue (INR)', 'Ad Spend (INR)', 'Platform Fees (INR)', 'Net Profit (INR)', 'ROAS'];
    downloadCSV([headers, ...dailySummaryRows()], `daily-summary-${todayISO()}.csv`);
  }

  function loadSheetJS() {
    return new Promise((resolve, reject) => {
      if (window.XLSX) return resolve(window.XLSX);
      const s = document.createElement('script');
      s.src = 'https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js';
      s.onload = () => resolve(window.XLSX);
      s.onerror = () => reject(new Error('Failed to load Excel library'));
      document.head.appendChild(s);
    });
  }

  async function exportExcel() {
    let XLSX;
    try { XLSX = await loadSheetJS(); }
    catch(e) { alert('Could not load the Excel library. Check internet, or use CSV export instead.'); return; }

    const wb = XLSX.utils.book_new();

    // Sheet 1: Daily Summary (most useful first)
    const summaryHeader = ['Date', 'Copies Sold', 'Revenue (INR)', 'Ad Spend (INR)', 'Platform Fees (INR)', 'Net Profit (INR)', 'ROAS'];
    const ws1 = XLSX.utils.aoa_to_sheet([summaryHeader, ...dailySummaryRows()]);
    XLSX.utils.book_append_sheet(wb, ws1, 'Daily Summary');

    // Sheet 2: Sales Ledger
    const salesData = [
      ['Date', 'Source', 'Quantity', 'Price (INR)', 'Revenue (INR)', 'Note'],
      ...STATE.sales.slice().sort((a,b) => new Date(a.date) - new Date(b.date)).map(s => {
        const price = s.price || STATE.settings.price;
        return [s.date, s.source || 'other', s.qty || 0, price, (s.qty || 0) * price, s.note || ''];
      })
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(salesData), 'Sales');

    // Sheet 3: Ad Spend Ledger
    const spendData = [
      ['Date', 'Platform', 'Amount (INR)', 'Campaign'],
      ...STATE.spend.slice().sort((a,b) => new Date(a.date) - new Date(b.date)).map(s => [s.date, s.platform || 'meta', s.amount || 0, s.campaign || ''])
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(spendData), 'Ad Spend');

    // Sheet 4: Snapshot
    const totalRev = STATE.sales.reduce((a,s) => a + (s.qty||0) * (s.price||STATE.settings.price), 0);
    const totalSpend = STATE.spend.reduce((a,s) => a + (s.amount||0), 0);
    const fees = totalRev * STATE.settings.feePercent / 100;
    const profit = totalRev - totalSpend - fees;
    const snap = [
      ['Brand', STATE.settings.brand],
      ['Exported At', new Date().toLocaleString('en-IN')],
      ['Default Price (INR)', STATE.settings.price],
      ['Platform Fee (%)', STATE.settings.feePercent],
      [],
      ['LIFETIME TOTALS', ''],
      ['Copies Sold', STATE.sales.reduce((a,s) => a + (s.qty||0), 0)],
      ['Gross Revenue (INR)', totalRev],
      ['Ad Spend (INR)', totalSpend],
      ['Platform Fees (INR)', fees],
      ['Net Profit (INR)', profit],
      ['ROAS', totalSpend > 0 ? (totalRev/totalSpend).toFixed(2) : 'N/A'],
      ['Profit Margin (%)', totalRev > 0 ? Math.round(profit/totalRev*100) : 0]
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(snap), 'Snapshot');

    XLSX.writeFile(wb, `dashboard-${todayISO()}.xlsx`);
  }

  // ---------- URL-based sharing ----------
  function encodeShareUrl() {
    const data = JSON.stringify({
      v: 1,
      s: STATE.sales,
      p: STATE.spend,
      c: STATE.settings
    });
    // Base64-encode UTF-8 safely
    const b64 = btoa(unescape(encodeURIComponent(data)));
    return location.origin + location.pathname + '#data=' + b64;
  }

  function decodeShareHash(hash, key) {
    try {
      const m = hash.match(new RegExp('^#' + key + '=(.+)$'));
      if (!m) return null;
      const json = decodeURIComponent(escape(atob(m[1])));
      return JSON.parse(json);
    } catch(e) { return null; }
  }

  function mergeIncoming(data) {
    const incomingSales = data.sales || data.s || [];
    const incomingSpend = data.spend || data.p || [];
    let salesAdded = 0, spendAddedOrReplaced = 0;

    incomingSales.forEach(s => {
      if (!s || !s.date) return;
      STATE.sales.push({
        id: s.id || uid('s'),
        date: s.date,
        qty: s.qty || 1,
        price: s.price || STATE.settings.price,
        source: s.source || 'meta',
        note: s.note || ''
      });
      salesAdded++;
    });

    incomingSpend.forEach(s => {
      if (!s || !s.date) return;
      const platform = s.platform || 'meta';
      // Dedup by date+platform: incoming wins (Claude's pull is the source of truth for that day)
      const existing = STATE.spend.findIndex(e => e.date === s.date && (e.platform || 'meta') === platform);
      const rec = {
        id: s.id || uid('sp'),
        date: s.date,
        amount: parseFloat(s.amount) || 0,
        platform: platform,
        campaign: s.campaign || ''
      };
      if (existing >= 0) STATE.spend[existing] = rec;
      else STATE.spend.push(rec);
      spendAddedOrReplaced++;
    });

    return { salesAdded, spendAddedOrReplaced };
  }

  function checkUrlHash() {
    // Full-replace mode (#data=)
    let data = decodeShareHash(location.hash, 'data');
    if (data) {
      const summary = `Shared dashboard URL:\n• ${(data.s||[]).length} sales\n• ${(data.p||[]).length} spend records\n\nREPLACE your current data?\n(Cancel to keep what you have.)`;
      if (confirm(summary)) {
        STATE.sales = Array.isArray(data.s) ? data.s : [];
        STATE.spend = Array.isArray(data.p) ? data.p : [];
        if (data.c) STATE.settings = { ...STATE.settings, ...data.c };
        save();
        history.replaceState(null, '', location.pathname);
      }
      return;
    }
    // Additive merge mode (#merge=)
    data = decodeShareHash(location.hash, 'merge');
    if (data) {
      const sCount = (data.sales || data.s || []).length;
      const pCount = (data.spend || data.p || []).length;
      const summary = `Incoming data from Claude / shared link:\n• ${sCount} sales to add\n• ${pCount} spend records to add or update\n\nMERGE into your existing dashboard?\n(Spend records that share a date with existing entries will be replaced. Sales records will be appended.)`;
      if (confirm(summary)) {
        const result = mergeIncoming(data);
        save();
        history.replaceState(null, '', location.pathname);
        setTimeout(() => alert(`Merged ${result.salesAdded} sales and ${result.spendAddedOrReplaced} spend records.`), 100);
      }
    }
  }

  function renderChart(buckets) {
    if (buckets.length === 0 || buckets.every(b => b.revenue === 0 && b.spend === 0)) {

    }
    const maxVal = Math.max(...buckets.map(b => Math.max(b.revenue, b.spend, b.profit, 1)));
    return `<div class="chart">${buckets.map(b => {
      const rh = b.revenue > 0 ? (b.revenue/maxVal)*100 : 0;
      const sh = b.spend > 0 ? (b.spend/maxVal)*100 : 0;

  function renderDonut(sources, total) {
    if (total === 0) return '<div class="empty" style="height:220px"><div class="empty-icon">○</div><div>No sales in this period</div></div>';
    const data = [
      { key: 'meta', label: 'Meta Ads', value: sources.meta || 0, color: '#7ab0e0' },
      { key: 'organic', label: 'Organic', value: sources.organic || 0, color: '#6ec585' },
      { key: 'other', label: 'Other', value: sources.other || 0, color: '#d4b88a' }
    ].filter(d => d.value > 0);
    const r = 50, c = 2 * Math.PI * r;
    let offset = 0;
    const segs = data.map(d => {
      const len = c * (d.value / total);
      const dasharray = `${len} ${c - len}`;
      const seg = `<circle cx="65" cy="65" r="${r}" fill="none" stroke="${d.color}" stroke-width="14" stroke-dasharray="${dasharray}" stroke-dashoffset="${-offset}" />`;
      offset += len;
      return seg;
    }).join('');
    return `
      <div class="donut-wrap">
        <div class="donut">
          <svg width="130" height="130" viewBox="0 0 130 130">
            <circle cx="65" cy="65" r="50" fill="none" stroke="#2a261d" stroke-width="14" />
            ${segs}
          </svg>
          <div class="donut-center">
            <div class="donut-center-val">${fmtShort(total)}</div>
            <div class="donut-center-label">Total</div>
          </div>
        </div>
        <div class="donut-legend">
          ${data.map(d => `
            <div class="donut-legend-item">
              <div class="donut-legend-left">
                <span class="legend-dot" style="background:${d.color}"></span>
                <span>${d.label}</span>
              </div>
              <span class="donut-legend-val">${Math.round(d.value/total*100)}% · ${fmtShort(d.value)}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

              <div style="font-size:12px;font-weight:600;color:var(--text);margin-bottom:8px">Step 3 &mdash; Add Meta MCP to Claude Code</div>
              <div class="how-steps" style="margin-bottom:10px">
                <div class="how-step"><div class="how-step-num">1</div><div class="how-step-body">Open your terminal and run the command below (replace the token value)</div></div>
              </div>
              <div class="code-block" id="mcpCmd">claude mcp add meta-ads -- env FACEBOOK_ACCESS_TOKEN=YOUR_TOKEN_HERE npx -y @anthropic/meta-mcp<button class="code-copy-btn" id="btnCopyMcpCmd">Copy</button></div>
              <div class="how-steps" style="margin-bottom:14px">
                <div class="how-step"><div class="how-step-num">2</div><div class="how-step-body">Restart Claude Code. Ask it: <em>"List my Meta ad accounts"</em> — if you see account names, the MCP is working</div></div>
                <div class="how-step"><div class="how-step-num">3</div><div class="how-step-body">Switch to the <b>Merge URL</b> tab, copy the prompt, paste it into Claude Code with your account ID filled in</div></div>
              </div>
              <div class="info-strip" style="font-size:11px">
                <b>Alternative — Claude.ai web:</b> Settings → Integrations → search for Meta Ads → Connect → authorise with your Meta Business account. No terminal needed.
              </div>`;
            document.getElementById('btnCopyMcpCmd').onclick = (e) => {
              e.stopPropagation();
              const cmd = 'claude mcp add meta-ads -- env FACEBOOK_ACCESS_TOKEN=YOUR_TOKEN_HERE npx -y @anthropic/meta-mcp';
              navigator.clipboard ? navigator.clipboard.writeText(cmd) : (() => { const ta = document.createElement('textarea'); ta.value = cmd; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); })();
              document.getElementById('btnCopyMcpCmd').innerText = '✓ Copied';
              setTimeout(() => { const b = document.getElementById('btnCopyMcpCmd'); if (b) b.innerText = 'Copy'; }, 1500);
            };
          } else {
            claudePanel.innerHTML = `
              ${isLocal ? '<div class="warn-strip"><b>Heads up:</b> You are viewing locally. Replace <code>ads-dashboard-lilac.vercel.app</code> with your deployed URL in the prompt.</div>' : ''}
              <div class="info-strip" style="margin-bottom:12px">
                Paste either prompt into Claude (with Meta MCP active). <b>Merge URL</b> gives you a one-click link; <b>CSV</b> works for any data size.
              </div>
              <div class="form-group">
                <label class="lbl">① One-click merge URL prompt (up to ~60 days)</label>
                <textarea id="fPromptMerge" class="ta" readonly style="min-height:160px;font-size:11px">${escapeHtml(promptMerge)}</textarea>
                <button class="btn" id="mCopyMerge" style="width:100%;justify-content:center;margin-top:8px">⎘ Copy prompt</button>
              </div>
              <div class="form-group">
                <label class="lbl">② CSV prompt (no size limit)</label>
                <textarea id="fPromptCsv" class="ta" readonly style="min-height:70px;font-size:11px">${escapeHtml(promptCsv)}</textarea>
                <button class="btn" id="mCopyCsv" style="width:100%;justify-content:center;margin-top:8px">⎘ Copy prompt</button>
              </div>`;
            const copyHandler = (taId, btnId, label) => {
              document.getElementById(btnId).onclick = () => {
                const ta = document.getElementById(taId);
                ta.select(); document.execCommand('copy');
                document.getElementById(btnId).innerText = '✓ Copied';
                setTimeout(() => { const b = document.getElementById(btnId); if(b) b.innerText = label; }, 1500);
              };
            };
            copyHandler('fPromptMerge', 'mCopyMerge', '⎘ Copy prompt');
            copyHandler('fPromptCsv', 'mCopyCsv', '⎘ Copy prompt');
          }
        };

        panel.innerHTML = `
          <div class="sub-tabs">
            <button class="sub-tab" data-sub="manual">① No MCP — Manual</button>
            <button class="sub-tab" data-sub="setup">② Setup Meta MCP</button>
            <button class="sub-tab" data-sub="prompt">③ Merge URL prompt</button>
          </div>
          <div id="claudeSubPanel"></div>
          <div class="modal-actions" style="margin-top:16px">
            <button class="btn" id="mCancel">Close</button>
          </div>`;
        document.getElementById('mCancel').onclick = closeModal;
        document.querySelectorAll('.sub-tab').forEach(t => t.onclick = () => renderClaudeTab(t.dataset.sub));
        renderClaudeTab('manual');

      } else if (which === 'url') {
        const url = encodeShareUrl();
        const isLocal = location.protocol === 'file:';
        const len = url.length;
        const tooLong = len > 8000;
        panel.innerHTML = `
          <div class="info-strip">
            ${isLocal ? '<b>Heads up:</b> You are viewing the dashboard from a local file, so the share URL points to your computer. <b>Deploy to Vercel/Netlify first</b>, then come back to generate a link anyone can open.<br><br>' : ''}
            The link below contains your full dashboard data baked into the URL itself. Anyone who opens it sees your exact numbers — no backend, no signup. ${len > 4000 ? '<b>Note:</b> URL is ' + (len/1024).toFixed(1) + ' KB. Some apps (WhatsApp, SMS) may truncate long URLs. If that happens, use JSON Snapshot instead.' : 'URL size: ' + (len/1024).toFixed(1) + ' KB.'}
          </div>
          ${tooLong ? '<div class="warn-strip"><b>URL is very long (' + (len/1024).toFixed(1) + ' KB).</b> Some platforms will reject it. Use JSON Snapshot tab for large datasets.</div>' : ''}
          <div class="form-group">
            <label class="lbl">Shareable URL</label>
            <textarea id="fShareUrl" class="ta" readonly style="min-height:100px;font-size:11px">${escapeHtml(url)}</textarea>
          </div>
          <div class="modal-actions">
            <button class="btn" id="mCancel">Close</button>
            <button class="btn primary" id="mCopyUrl">⎘ Copy URL</button>
          </div>`;
        document.getElementById('mCancel').onclick = closeModal;
        document.getElementById('mCopyUrl').onclick = () => {
          const ta = document.getElementById('fShareUrl');
          ta.select(); document.execCommand('copy');
          document.getElementById('mCopyUrl').innerText = '✓ Copied';
          setTimeout(() => { document.getElementById('mCopyUrl').innerText = '⎘ Copy URL'; }, 1500);
        };

      } else if (which === 'json') {
        panel.innerHTML = `
          <div class="info-strip">
            JSON snapshot for backups or sending to clients. Recipients paste it into the <b>Import</b> tab.
          </div>
          <div class="form-group">
            <label class="lbl">Snapshot</label>
            <textarea id="fExport" class="ta" readonly style="min-height:200px;font-size:11px">${escapeHtml(snapshot)}</textarea>
          </div>
          <div class="modal-actions">
            <button class="btn" id="mCancel">Close</button>
            <button class="btn" id="mDownload">⇣ Download .json</button>
            <button class="btn primary" id="mCopy">⎘ Copy</button>
          </div>`;
        document.getElementById('mCancel').onclick = closeModal;
        document.getElementById('mCopy').onclick = () => {
          const ta = document.getElementById('fExport');
          ta.select(); document.execCommand('copy');
          document.getElementById('mCopy').innerText = '✓ Copied';
          setTimeout(() => { document.getElementById('mCopy').innerText = '⎘ Copy'; }, 1500);
        };
        document.getElementById('mDownload').onclick = () => {
          const blob = new Blob([snapshot], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = `dashboard-snapshot-${todayISO()}.json`; a.click();
          URL.revokeObjectURL(url);
        };

      } else {
        panel.innerHTML = `
          <div class="warn-strip">
            <b>Heads up:</b> Importing replaces your current data. Export a backup first if you want to keep it.
          </div>
          <div class="form-group">
            <label class="lbl">Paste snapshot JSON</label>
            <textarea id="fImport" class="ta" placeholder="Paste the JSON snapshot here…"></textarea>
          </div>
          <div class="modal-actions">
            <button class="btn" id="mCancel">Cancel</button>
            <button class="btn primary" id="mImportSnap">Replace my data</button>
          </div>`;
        document.getElementById('mCancel').onclick = closeModal;
        document.getElementById('mImportSnap').onclick = () => {
          try {
            const data = JSON.parse(document.getElementById('fImport').value);
            if (!confirm('Replace all current data with this snapshot? This cannot be undone unless you exported a backup.')) return;
            STATE.sales = Array.isArray(data.sales) ? data.sales : [];
            STATE.spend = Array.isArray(data.spend) ? data.spend : [];
            if (data.settings) STATE.settings = { ...STATE.settings, ...data.settings };
            save(); closeModal(); render();
            setTimeout(() => alert(`Imported ${STATE.sales.length} sales and ${STATE.spend.length} spend records.`), 100);
          } catch(e) {
            alert('Could not parse JSON. Make sure you copied the entire snapshot.');
          }
        };
      }
    };
    renderTab(initialTab);
    bg.querySelectorAll('.modal-tab').forEach(t => t.onclick = () => renderTab(t.dataset.share));
  }

  function openSettingsModal() {
    const bg = document.getElementById('modalBg');
    bg.innerHTML = `
      <div class="modal">
        <div class="modal-title">Settings</div>
        <div class="modal-sub">Configure brand, pricing, and platform fees</div>
        <div class="form-group">
          <label class="lbl">Brand / Product Name</label>
          <input type="text" id="sBrand" class="inp" value="${escapeHtml(STATE.settings.brand)}" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="lbl">Default Price (₹)</label>
            <input type="number" id="sPrice" class="inp" value="${STATE.settings.price}" min="0" />
          </div>
          <div class="form-group">
            <label class="lbl">Platform Fee (%)</label>
            <input type="number" id="sFee" class="inp" value="${STATE.settings.feePercent}" min="0" max="50" step="0.1" />
          </div>
        </div>
        <div class="warn-strip">
          <b>SuperProfile</b> typically charges ~5% platform fee. Razorpay (their processor) is ~2%. Set this to your effective net cut.
        </div>
        <div class="form-group">
          <label class="lbl" style="color:var(--red)">Danger Zone</label>
          <button class="btn" id="sReset" style="border-color:#5a3030;color:var(--red);width:100%;justify-content:center">⚠ Erase all sales &amp; spend records</button>
        </div>
        <div class="modal-actions">
          <button class="btn" id="mCancel">Cancel</button>
          <button class="btn primary" id="mSaveSettings">Save Settings</button>
        </div>
      </div>`;
    bg.classList.add('show');
    document.getElementById('mCancel').onclick = closeModal;
    document.getElementById('mSaveSettings').onclick = () => {
      STATE.settings.brand = document.getElementById('sBrand').value || "The Modern Man's Edge";
      STATE.settings.price = parseFloat(document.getElementById('sPrice').value) || 999;
      STATE.settings.feePercent = parseFloat(document.getElementById('sFee').value) || 5;
      save(); closeModal(); render();
    };
    document.getElementById('sReset').onclick = () => {
      if (confirm('Erase ALL sales and spend records? This cannot be undone.')) {
        STATE.sales = []; STATE.spend = [];
        save(); closeModal(); render();
      }
    };
  }

  function closeModal() {
    const bg = document.getElementById('modalBg');
    if (bg) { bg.classList.remove('show'); bg.innerHTML = ''; }
  }

  function attachListeners() {
    document.querySelectorAll('.tab').forEach(b => b.onclick = () => { STATE.period = b.dataset.period; render(); });
    document.querySelectorAll('.section-tab').forEach(b => b.onclick = () => { STATE.section = b.dataset.section; render(); });
    const map = {
      btnAddSale: openAddSaleModal,
      btnAddSpend: openAddSpendModal,
      btnImport: openImportModal,
      btnShare: openShareModal,
      btnClaude: () => openShareModal('claude'),
      btnSettings: openSettingsModal
    };
    Object.keys(map).forEach(id => {
      const el = document.getElementById(id);
      if (el) el.onclick = map[id];
    });
    document.querySelectorAll('[data-del-sale]').forEach(b => b.onclick = () => {
      STATE.sales = STATE.sales.filter(s => s.id !== b.dataset.delSale);
      save(); render();
    });
    document.querySelectorAll('[data-del-spend]').forEach(b => b.onclick = () => {
      STATE.spend = STATE.spend.filter(s => s.id !== b.dataset.delSpend);
      save(); render();
    });
    const bg = document.getElementById('modalBg');
    if (bg) bg.onclick = (e) => { if (e.target === bg) closeModal(); };
    const emptyBtns = {
      emptyAddSale: openAddSaleModal,
      emptyImportSales: () => openImportModal('sales'),
      emptyAddSpend: openAddSpendModal,
      emptyImportSpend: () => openImportModal('meta'),
    };
    Object.keys(emptyBtns).forEach(id => { const el = document.getElementById(id); if (el) el.onclick = emptyBtns[id]; });
    const dismissBtn = document.getElementById('btnDismissOnboard');
    if (dismissBtn) dismissBtn.onclick = () => { localStorage.setItem('tmeDashboard_onboard_dismissed', '1'); render(); };
  }

  load();
  checkUrlHash();
  render();
})();
</script>
</body>
</html>
